stages:
  - build
  - package

# Build directories are cached so incremental builds survive between pipelines.
# CMake stores absolute paths (CMAKE_CACHEFILE_DIR / CMAKE_HOME_DIRECTORY) inside
# CMakeCache.txt, so a cached build tree can only be restored into the very same
# path it was created in. GitLab Runner checks out into
#   <builds_dir>/<short-token>/<concurrent-project-id>/<namespace>/<project>
# and a job may land in any free concurrency slot of the runner, so the project
# dir changes between pipelines. Keying the cache on $CI_JOB_NAME alone therefore
# restores slot 0's cache into slot 1 and CMake aborts with
#   "The current CMakeCache.txt directory ... is different than the directory
#    ... where CMakeCache.txt was created"
# $CI_CONCURRENT_PROJECT_ID is exactly the path segment above, so including it in
# the key pins every cache archive to one fixed build path.

# Linux x64/arm64 OpenGL
build_linux_opengl:
  stage: build
  script:
    - git submodule sync --recursive
    - git submodule update --init --recursive --force
    - if [ ! -d build ]; then mkdir build; fi
    - cd build
    - cmake ..
      -DJE4_INSTALL_PKG_BY_BAOZI_WHEN_BUILD=OFF
      -DJE4_STATIC_LINK_MODULE_AND_PKGS=OFF
      -DJE4_ENABLE_DX11_GAPI=OFF
      -DJE4_ENABLE_OPENGL330_GAPI=ON
      -DJE4_ENABLE_OPENGLES300_GAPI=OFF
      -DJE4_ENABLE_VULKAN120_GAPI=OFF
      -DJE4_ENABLE_METAL_GAPI=OFF
      -DCMAKE_BUILD_TYPE=RELWITHDEBINFO
    - if [ ! -d pkg ]; then mkdir pkg; fi
    - if [ ! -d builtin ]; then mkdir builtin; fi
    - cmake --build . --config=RELWITHDEBINFO --target jedriver
    - cd ..
  cache:
    when: on_success
    key: $CI_JOB_NAME-$CI_CONCURRENT_PROJECT_ID
    paths:
        - "build/*"
  tags:
    - ubuntu20

