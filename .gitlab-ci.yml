# Windows x64 OpenGL DX11 Vulkan

build_win64_dx11_opengl_vk:
  stage: build
  script:
    - git submodule sync --recursive
    - git submodule update --init --recursive --force
    - if not exist cmakebuild ( mkdir cmakebuild )
    - cd cmakebuild
    - cmake ..
      -A x64
      -DJE4_INSTALL_PKG_BY_BAOZI_WHEN_BUILD=ON
      -DJE4_STATIC_LINK_MODULE_AND_PKGS=ON
      -DJE4_BUILD_SHARED_CORE=ON
      -DJE4_ENABLE_DX11_GAPI=ON
      -DJE4_ENABLE_OPENGL330_GAPI=ON
      -DJE4_ENABLE_OPENGLES300_GAPI=OFF
      -DJE4_ENABLE_VULKAN120_GAPI=ON
      -DJE4_ENABLE_METAL_GAPI=OFF
      -DCMAKE_BUILD_TYPE=RELWITHDEBINFO
    - cmake --build . --config=RELWITHDEBINFO --target jedriver --parallel
    - cd ..
    - cd build
    - copy RELWITHDEBINFO\*
    - cd ..
  # Raw output, used only as transit artifacts for the packaging jobs below.
  artifacts:
    name: jeecs-win32-raw-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHA
    paths:
      - build/jedriver.exe
      - build/OpenAL32.dll
      - build/libjoyecs.dll
      - build/libwoo.dll
      - build/libwoort.dll
      - build/libjoyecs.lib
      - build/jedriver.pdb
      - build/libjoyecs.pdb
      - build/libwoo.pdb
      - build/libwoort.pdb
      - build/pkg/*
      - build/builtin/*
      - build/licenses/*
      - build/je/*
    expire_in: 1 day
  cache:
    when: on_success
    key: $CI_JOB_NAME-$CI_CONCURRENT_PROJECT_ID
    paths:
        - "cmakebuild/*"
  tags:
    - winserver22

# Package the win64 build into two separate artifact archives:
# one without pdb files, and one containing pdb files only.
package_win64_release:
  stage: package
  needs:
    - build_win64_dx11_opengl_vk
  script:
    - if exist build\*.pdb ( del build\*.pdb )
  artifacts:
    name: jeecs-win32-release-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHA
    paths:
      - build/jedriver.exe
      - build/OpenAL32.dll
      - build/libjoyecs.dll
      - build/libwoo.dll
      - build/libwoort.dll
      - build/libjoyecs.lib
      - build/pkg/*
      - build/builtin/*
      - build/licenses/*
      - build/je/*
  tags:
    - winserver22

package_win64_pdb:
  stage: package
  needs:
